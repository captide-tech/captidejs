name: Publish Package to npm

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/publish.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      - name: Build package
        run: yarn build

      - name: Extract version
        id: package-version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # A test-only or tooling change under src/ retriggers this workflow at an
      # unchanged version, and npm rejects republishing one.
      - name: Publish to npm
        run: |
          if npm view "captide@$VERSION" version >/dev/null 2>&1; then
            echo "captide@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --access public
        env:
          VERSION: ${{ steps.package-version.outputs.VERSION }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
